<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="description" content="Radar de notícias: acompanhe fontes confiáveis e crie seus próprios assuntos."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css"><title>Radar — Notícias</title></head>
<body><div class="app">
<header class="topbar"><a class="brand" href="./"><span class="brand-mark">R</span><span>Radar<span class="brand-dot">.</span></span></a><nav><button class="nav-btn active" data-view="home">Início</button><button class="nav-btn" data-view="radar">Meu radar</button></nav><button id="installBtn" class="icon-btn" hidden>＋ Instalar</button></header>
<main>
<section id="homeView" class="view active"><div class="hero"><div><div class="eyebrow">RADAR DE NOTÍCIAS</div><h1>O que está acontecendo<br><em>agora?</em></h1><p>Uma leitura limpa das notícias de fontes selecionadas, sem ruído e sem perder tempo.</p></div><div class="pulse"><span></span><small>atualização diária</small></div></div>
<div class="toolbar"><label class="search"><span>⌕</span><input id="search" placeholder="Buscar notícias..." autocomplete="off"></label><div id="sourceFilters" class="chips"></div></div>
<div id="status" class="status"></div><section id="newsGrid" class="news-grid"></section></section>
<section id="radarView" class="view"><div class="section-head"><div><div class="eyebrow">PERSONALIZE</div><h2>Meu radar</h2><p>Digite um assunto e acompanhe novas ocorrências nas fontes cadastradas.</p></div></div>
<div class="radar-create"><input id="radarInput" placeholder="Ex.: inteligência artificial na educação"><button id="addRadar">Criar radar</button></div><div id="radars" class="radars"></div></section>
</main>
<footer><span>Radar Notícias</span><span id="lastUpdate"></span><button id="notifyBtn" class="footer-btn">Ativar notificações</button></footer>
</div><script src="app.js"></script></body></html>

name: Atualizar notícias
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar fontes
        run: python scripts/collect.py
      - name: Commitar atualização
        run: |
          git config user.name "Radar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/.updated
          git diff --cached --quiet || git commit -m "Atualizar notícias"
          git push
